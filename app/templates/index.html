<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy - AI Workout Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="page">
  <div class="card">
    <h1>FitBuddy</h1>
    <p class="lede">Tell us about you and get a 7-day workout plan built for your goal.</p>

    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}

    <form action="/generate-workout" method="post" id="plan-form">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required maxlength="100" value="{{ values.username or '' }}">

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" required min="1" value="{{ values.user_id or '' }}">

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required min="10" max="100" value="{{ values.age or '' }}">

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" required min="20" max="400" step="0.1" value="{{ values.weight or '' }}">

      <label for="goal">Fitness goal</label>
      <input type="text" id="goal" name="goal" required maxlength="200" list="goal-options"
             placeholder="e.g. weight loss, muscle gain, flexibility" value="{{ values.goal or '' }}">
      <datalist id="goal-options">
        <option value="weight loss">
        <option value="muscle gain">
        <option value="general fitness">
        <option value="flexibility">
      </datalist>

      <label for="intensity">Workout intensity</label>
      <select id="intensity" name="intensity" required>
        {% for level in ['low', 'medium', 'high'] %}
        <option value="{{ level }}" {% if (values.intensity or '')|lower == level %}selected{% endif %}>{{ level|capitalize }}</option>
        {% endfor %}
      </select>

      <button type="submit" id="submit-btn">Generate plan</button>
    </form>

    <div class="nav"><a class="btn ghost" href="/view-all-users">View all users</a></div>
  </div>
</main>
<script>
  document.getElementById("plan-form").addEventListener("submit", function () {
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Building your plan...";
  });
</script>
</body>
</html>
